{% extends "base.html" %}{% block title %}Profile | SkillSpring{% endblock %}{% block content %}<section class="page-section"><div class="container narrow"><div class="eyebrow">Your account</div><h1>Profile settings.</h1><form class="auth-card profile-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input class="form-control" name="full_name" value="{{ current_user.full_name }}" required></label><label>Email address<input class="form-control" value="{{ current_user.email }}" disabled></label><label>Learning goal<input class="form-control" name="learning_goal" value="{{ current_user.learning_goal or '' }}" maxlength="255" placeholder="What would you like to build?"></label><button class="button button-primary" type="submit">Save changes</button></form></div></section>{% endblock %}
